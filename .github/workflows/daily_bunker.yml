name: Daily Bunker Price Pipeline

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper and Upsert
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python main.py
